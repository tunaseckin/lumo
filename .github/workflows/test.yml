name: test
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install xxd (Linux)
        if: runner.os == 'Linux'
        run: command -v xxd || (sudo apt-get update && sudo apt-get install -y xxd)
      - name: Build and test
        run: make test
