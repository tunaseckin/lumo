# Push a tag like v0.1.0 to build lumo for macOS, Linux and Windows and attach it to a GitHub release.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install xxd (Linux)
        if: runner.os == 'Linux'
        run: command -v xxd || (sudo apt-get update && sudo apt-get install -y xxd)
      - name: Build and test
        run: make test
      - name: Package
        run: |
          dir="lumo-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp lumo README.md LICENSE "$dir"/
          cp -r examples docs "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - name: VS Code extension
        if: runner.os == 'Linux'
        run: python3 editor/vscode/build_vsix.py && cp editor/vscode/lumo-lang.vsix .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            lumo-*.tar.gz
            lumo-lang.vsix

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make vim zip mingw-w64-ucrt-x86_64-gcc
      - name: Build and test
        run: make test
      - name: Package
        run: |
          dir="lumo-${GITHUB_REF_NAME}-windows-x64"
          mkdir "$dir"
          cp lumo.exe README.md LICENSE "$dir"/
          cp -r examples docs "$dir"/
          zip -qr "$dir.zip" "$dir"
      - uses: softprops/action-gh-release@v2
        with:
          files: lumo-*.zip
