# Push a tag like v0.1.0 to build lumo for macOS and Linux and attach it to a GitHub release.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install xxd (Linux)
        if: runner.os == 'Linux'
        run: command -v xxd || (sudo apt-get update && sudo apt-get install -y xxd)
      - name: Build and test
        run: make test
      - name: Package
        run: |
          dir="lumo-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp lumo README.md LICENSE "$dir"/
          cp -r examples docs "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - uses: softprops/action-gh-release@v2
        with:
          files: lumo-*.tar.gz
